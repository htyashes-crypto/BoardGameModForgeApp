appId: com.actframework.modforge
productName: ModForge
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - package.json
  - "!**/*.{md,map,ts}"

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: ModForge
  uninstallDisplayName: ModForge ${version}
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: ModForge-Setup-${version}-${arch}.${ext}

portable:
  artifactName: ModForge-Portable-${version}-${arch}.${ext}

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  artifactName: ModForge-${version}-${arch}.${ext}

dmg:
  title: ModForge ${version}
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# 阶段 3 GitHub 自动更新;token 走本地 GH_TOKEN 环境变量
publish:
  provider: github
  owner: htyashes-crypto
  repo: BoardGameModForgeApp
  releaseType: release
